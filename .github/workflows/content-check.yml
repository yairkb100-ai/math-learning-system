name: Content check

on:
  pull_request:
    paths:
      - "content/**"
      - "scripts/check_assets.py"
      - "scripts/gen_chapter_assets.py"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/check_assets.py"
      - "scripts/gen_chapter_assets.py"

jobs:
  check-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run content assets check
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python scripts/check_assets.py
      - name: Sheet math renderer tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python scripts/test_sheet_math.py
          python scripts/test_fix_sheet_bidi.py

      - name: No RTL-reordered math left in the sheets
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python scripts/fix_sheet_bidi.py --check
