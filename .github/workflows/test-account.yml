name: Test account

# יוצר/מסנכרן חשבון בדיקה עם מנוי על מוצר אחד בלבד — המצב היחיד שבו הטעימה
# הצולבת (cross_product_free_pct) נראית באתר. ידני בלבד: אין טריגר על push,
# כדי שחשבון בדיקה לא ייווצר בפרודקשן בטעות בכל מיזוג.
#
# משתמש באותו secrets.DATABASE_URL של seed.yml — אין כאן גישה חדשה לשום דבר.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "create = יוצר/מסנכרן, delete = מוחק את החשבון על כל שורות ה-FK"
        required: true
        default: "create"
        type: choice
        options: [create, delete]
      username:
        description: "שם המשתמש של חשבון הבדיקה"
        required: true
        default: "bodek-karni"
      product:
        description: "המוצר שיישאר פעיל (בשני תוצג הטעימה)"
        required: true
        default: "lomda"
        type: choice
        options: [lomda, karni]
      days:
        description: "לכמה ימים המנוי בתוקף"
        required: false
        default: "365"

jobs:
  make-account:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Create/sync the test account
        if: ${{ inputs.action == 'create' }}
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python scripts/make_test_account.py \
            --username "${{ inputs.username }}" \
            --product "${{ inputs.product }}" \
            --days "${{ inputs.days }}"

      - name: Delete the test account
        if: ${{ inputs.action == 'delete' }}
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: python scripts/make_test_account.py --delete "${{ inputs.username }}"
